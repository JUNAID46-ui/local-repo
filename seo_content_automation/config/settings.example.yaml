schedule:
  timezone: "Asia/Karachi"
  hour: 18
  minute: 0

content:
  max_articles_per_business: 5
  target_keyword_density: 2.0
  keyword_density_tolerance: 0.5
  max_revision_attempts: 3
  meta_description_min_length: 140
  meta_description_max_length: 160
  min_article_word_count: 1200
  max_article_word_count: 2500

images:
  featured_count: 1
  supporting_min: 2
  supporting_max: 4

models:
  primary: "claude-sonnet-4-20250514"
  research: "claude-sonnet-4-20250514"
  validation: "claude-haiku-4-5-20251001"

paths:
  output_dir: "output"
  log_dir: "logs"
  data_dir: "data"

google:
